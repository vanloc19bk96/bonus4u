<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binario — KDP Puzzle Book Generator</title>
<!--
  Runs straight from disk: double-click this file. Everything it needs is in
  this folder, so there are no module scripts, no network calls and no CDN
  links — all of those are blocked or unreliable on the file:// origin (spec 2).
-->
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><span class="dot dot-w"></span><span class="dot dot-b"></span></span>
    <div>
      <h1>Binario Puzzle Book</h1>
      <p class="sub">Create a KDP-ready interior PDF — runs fully offline</p>
    </div>
  </div>
</header>

<main class="layout">

  <!-- ------------------------------------------------------------- form -->
  <section class="panel form-panel" aria-labelledby="form-h">
    <h2 id="form-h" class="panel-h">Book settings</h2>

    <form id="book-form" autocomplete="off">

      <div class="field">
        <label for="f-title">1 · Book title</label>
        <input type="text" id="f-title" value="Binario Puzzles" maxlength="80">
      </div>

      <div class="field">
        <label for="f-subtitle">2 · Subtitle <span class="opt">(optional)</span></label>
        <input type="text" id="f-subtitle" value="100 Black &amp; White Logic Puzzles" maxlength="120">
      </div>

      <div class="field">
        <label for="f-trim">3 · Trim size</label>
        <select id="f-trim"></select>
        <p class="hint" id="trim-hint"></p>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-size">4 · Grid size</label>
          <select id="f-size">
            <option value="6">6 × 6</option>
            <option value="8">8 × 8</option>
            <option value="10" selected>10 × 10</option>
            <option value="12">12 × 12</option>
            <option value="14">14 × 14</option>
          </select>
        </div>

        <div class="field">
          <label for="f-diff">5 · Difficulty</label>
          <select id="f-diff">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
            <option value="mixed">Mixed</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="f-count">6 · Number of puzzles <span class="opt">(10 – 500)</span></label>
        <input type="number" id="f-count" value="100" min="10" max="500" step="1">
      </div>

      <fieldset class="field">
        <legend>7 · Puzzles per page</legend>
        <div class="radios">
          <label class="radio"><input type="radio" name="perpage" value="1"><span>1 <em>(large print)</em></span></label>
          <label class="radio"><input type="radio" name="perpage" value="2" checked><span>2</span></label>
          <label class="radio"><input type="radio" name="perpage" value="4"><span>4</span></label>
        </div>
      </fieldset>

      <div class="field">
        <label class="check"><input type="checkbox" id="f-howto" checked><span>8 · How to play page</span></label>
      </div>

      <div id="summary" class="summary" role="status" aria-live="polite"></div>
      <div id="problems" class="problems" role="alert"></div>

      <div class="actions">
        <button type="submit" id="btn-generate" class="btn btn-primary">Generate puzzles</button>
        <button type="button" id="btn-download" class="btn btn-ok" disabled>Download PDF</button>
        <button type="button" id="btn-sample" class="btn btn-ghost" disabled>Download test file (4 sample pages)</button>
      </div>

      <div id="progress-wrap" class="progress-wrap" hidden>
        <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
        <p id="progress-text" class="progress-text"></p>
      </div>

      <p id="gen-note" class="gen-note"></p>
    </form>
  </section>

  <!-- ---------------------------------------------------------- preview -->
  <section class="panel preview-panel" aria-labelledby="preview-h">
    <div class="preview-head">
      <h2 id="preview-h" class="panel-h">Preview</h2>
      <div class="tabs" id="preview-tabs" role="tablist">
        <button type="button" class="tab is-on" data-kind="puzzles" role="tab">Puzzle pages</button>
        <button type="button" class="tab" data-kind="solutions" role="tab">Solutions</button>
        <button type="button" class="tab" data-kind="howto" role="tab">How to play</button>
        <button type="button" class="tab" data-kind="title" role="tab">Title page</button>
      </div>
    </div>
    <div class="preview-stage"><div id="preview-box" class="preview-box"></div></div>
    <div class="preview-nav" id="preview-nav" role="navigation" aria-label="Preview pages">
      <button type="button" class="nav-btn" id="btn-prev" aria-label="Previous page">← Prev</button>
      <label class="nav-page">
        <span class="nav-label">Page</span>
        <input type="number" id="f-preview-page" min="1" step="1" value="1" aria-label="Page number">
        <span class="nav-of" id="preview-of">/ 1</span>
      </label>
      <button type="button" class="nav-btn" id="btn-next" aria-label="Next page">Next →</button>
    </div>
    <p class="preview-legend">
      <span class="key key-safe"></span> safe area
      <span class="preview-note" id="preview-note"></span>
    </p>
  </section>

</main>

<footer class="foot">
  <p>No internet required · No install · Everything runs in this browser.
     PDF is no-bleed, page size matches trim size, fonts are fully embedded.</p>
</footer>

<!-- Classic script tags, dependency order — see spec 6.1. -->
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/font-notosans.js"></script>
<script src="js/binario-core.js"></script>
<script src="js/kdp-layout.js"></script>
<script src="js/pdf-export.js"></script>
<script src="js/preview.js"></script>
<script src="js/app.js"></script>
</body>
</html>
