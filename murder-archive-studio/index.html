<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murder Archive Studio</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<noscript><p class="noscript">This app needs JavaScript. Please allow scripts for this page and reload it.</p></noscript>
<div class="app" id="app" aria-busy="true">
  <aside class="sidebar" aria-label="Book steps">
    <header class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 11h30v6a3 3 0 0 0 0 6v6H5v-6a3 3 0 0 0 0-6z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M14 11v18" stroke="currentColor" stroke-width="2" stroke-dasharray="2.4 2.2"/><circle cx="25" cy="19" r="3.6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M27.6 21.6l3 3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div>
        <h1>Murder Archive Studio</h1>
        <p class="brand-sub">Elimination mystery puzzle books for Amazon KDP</p>
      </div>
    </header>
    <ol class="steps" id="steps"></ol>
    <footer class="project-bar">
      <button type="button" class="btn-quiet" id="btnSample">See a finished sample</button>
      <button type="button" class="btn-quiet" id="btnExport">Save project file</button>
      <button type="button" class="btn-quiet" id="btnImport">Open project file</button>
      <button type="button" class="btn-quiet danger-text" id="btnStartOver">Start over</button>
      <input type="file" id="fileImport" accept=".json,application/json" hidden>
    </footer>
  </aside>

  <main class="viewer" aria-label="Book preview">
    <div class="toolbar" role="toolbar" aria-label="Preview controls">
      <div class="view-switch" role="group" aria-label="What to show">
        <button type="button" id="btnViewBook" aria-pressed="true">Pages</button>
        <button type="button" id="btnViewCover" aria-pressed="false">Cover</button>
      </div>
      <label class="nav-label"><span class="sr-only">Jump to</span>
        <select id="navSelect" aria-label="Jump to a part of the book"></select>
      </label>
      <div class="tool-group">
        <button type="button" class="icon-btn" id="btnPrev" aria-label="Previous pages" title="Previous pages (Page Up)">&#8249;</button>
        <span class="page-indicator" id="pageIndicator" aria-live="polite"></span>
        <button type="button" class="icon-btn" id="btnNext" aria-label="Next pages" title="Next pages (Page Down)">&#8250;</button>
      </div>
      <div class="tool-group">
        <button type="button" class="icon-btn" id="btnZoomOut" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
        <button type="button" class="zoom-value" id="btnZoomFit" title="Fit to window">100%</button>
        <button type="button" class="icon-btn" id="btnZoomIn" aria-label="Zoom in" title="Zoom in (+)">+</button>
      </div>
      <div class="tool-group toggles">
        <label class="toggle" title="Shows the KDP safe area and the inside (gutter) margin, or the cover's trim, spine and barcode box"><input type="checkbox" id="tglMargins"> <span>Show margins</span></label>
        <label class="toggle" title="Highlights the answer in the register. Only on screen, never in the PDF."><input type="checkbox" id="tglKiller"> <span>Show the answer</span></label>
      </div>
      <div class="tool-end">
        <span class="busy" id="busy" hidden>Updating&hellip;</span>
        <button type="button" class="btn btn-primary btn-download" id="btnDownload" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="btnDownloadLabel">Download PDF</span></button>
      </div>
    </div>
    <div class="sample-banner" id="sampleBanner" hidden>
      <span><strong>Sample book.</strong> A finished example to show what you will make. It cannot be downloaded.</span>
      <label class="sample-pick"><span class="sr-only">Choose a sample</span><select id="samplePick"></select></label>
      <button type="button" class="btn small" id="btnCloseSample">Back to my book</button>
    </div>
    <div class="spreads" id="spreads" tabindex="0" aria-label="Book pages, two-page spreads"></div>
  </main>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="loading" id="loading">Opening the archive&hellip;</div>

<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/fonts.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/text.js"></script>
<script src="js/core/names.js"></script>
<script src="js/core/metrics.js"></script>
<script src="js/core/themes.js"></script>
<script src="js/core/register.js"></script>
<script src="js/core/fields.js"></script>
<script src="js/core/clues.js"></script>
<script src="js/core/kdp.js"></script>
<script src="js/core/reader.js"></script>
<script src="js/core/prompts.js"></script>
<script src="js/core/story.js"></script>
<script src="js/core/types.js"></script>
<script src="js/data/archives.js"></script>
<script src="js/core/book.js"></script>
<script src="js/core/extras.js"></script>
<script src="js/core/layout.js"></script>
<script src="js/core/checklist.js"></script>
<script src="js/core/cover.js"></script>
<script src="js/core/cover-art.js"></script>
<script src="js/core/cover-designs.js"></script>
<script src="js/render/svg.js"></script>
<script src="js/render/pdf.js"></script>
<script src="js/data/sample.js"></script>
<script src="js/data/sample-manifest.js"></script>
<script src="js/ui/dom.js"></script>
<script src="js/ui/preview.js"></script>
<script src="js/ui/sidebar.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
