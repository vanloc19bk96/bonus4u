<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{tagline}}">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/hub.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>{{title}}</h1>
      <p class="tagline">{{tagline}}</p>
    </header>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search tools…" aria-label="Search tools" autocomplete="off">
      <span class="count" id="count">{{count}} tools</span>
    </div>

    <ul class="grid" id="apps">
      <!-- build:apps -->
    </ul>
    <p class="empty" id="empty" hidden>No tools match your search.</p>

    <footer class="foot">
      Questions? Email <a href="mailto:david@fastaifactory.com">david@fastaifactory.com</a>
    </footer>
  </main>

  <script>
    (() => {
      const input = document.getElementById('search');
      const items = [...document.querySelectorAll('#apps > li')];
      const count = document.getElementById('count');
      const empty = document.getElementById('empty');
      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        let shown = 0;
        for (const li of items) {
          const match = !q || li.textContent.toLowerCase().includes(q);
          li.hidden = !match;
          if (match) shown++;
        }
        count.textContent = `${shown} tool${shown === 1 ? '' : 's'}`;
        empty.hidden = shown > 0;
      });
    })();
  </script>
</body>
</html>
